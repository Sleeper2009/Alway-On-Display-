name: Build AODTweak

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      THEOS: /home/runner/theos

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl git perl xz-utils

      - name: Clone Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $THEOS

      - name: Install Linux toolchain (clang/ld64)
        run: |
          curl -LO https://github.com/sbingner/llvm-project/releases/latest/download/linux-ios-arm64e-clang-toolchain.tar.lzma
          TMP=$(mktemp -d)
          tar -xvf linux-ios-arm64e-clang-toolchain.tar.lzma -C $TMP
          mkdir -p $THEOS/toolchain/linux/iphone
          mv $TMP/ios-arm64e-clang-toolchain/* $THEOS/toolchain/linux/iphone/
          rm -rf linux-ios-arm64e-clang-toolchain.tar.lzma $TMP

      - name: Download iOS SDK
        run: |
          git clone -n --depth=1 --filter=tree:0 https://github.com/theos/sdks.git
          cd sdks
          git sparse-checkout set --no-cone iPhoneOS15.6.sdk
          git checkout
          mv iPhoneOS15.6.sdk $THEOS/sdks/
          cd ..

      - name: Build package (rootless)
        run: |
          export THEOS_PACKAGE_SCHEME=rootless
          make package FINALPACKAGE=1

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: AODTweak-rootless
          path: packages/*.deb
